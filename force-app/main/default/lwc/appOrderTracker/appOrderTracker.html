<template>
    <lightning-card title="Order History & Support" icon-name="custom:custom18">
        <div class="slds-var-m-around_medium">
            
            <!-- Account Selector Dropdown (Visible on Dashboard Pages) -->
            <template if:true={showAccountDropdown}>
                <div class="slds-var-m-bottom_small">
                    <lightning-combobox
                        name="accountSelector"
                        label="Select Account"
                        value={selectedAccountId}
                        placeholder="Choose an Account..."
                        options={accountOptions}
                        onchange={handleAccountChange}>
                    </lightning-combobox>
                </div>
            </template>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading Orders..." size="medium"></lightning-spinner>
            </template>

            <!-- Order Datatable -->
            <template if:true={hasOrders}>
                <lightning-datatable
                    key-field="Id"
                    data={orders}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>

            <!-- Empty State -->
            <template if:false={hasOrders}>
                <template if:false={isLoading}>
                    <div class="slds-text-align_center slds-text-color_weak slds-var-p-around_medium">
                        No order records found for the selected Account.
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>

    <!-- Modal for Creating Support Case -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                            title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Log Support Ticket</h2>
                    <p class="slds-text-body_small slds-var-m-top_xx-small">Order ID: {selectedOrderNumber}</p>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-var-p-around_medium">
                    <lightning-input 
                        label="Case Subject" 
                        value={caseSubject} 
                        onchange={handleSubjectChange} 
                        required>
                    </lightning-input>

                    <lightning-textarea 
                        label="Description / Issue Details" 
                        value={caseDescription} 
                        onchange={handleDescriptionChange} 
                        required>
                    </lightning-textarea>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal} class="slds-var-m-right_x-small"></lightning-button>
                    <lightning-button label="Submit Ticket" variant="brand" onclick={handleSubmitCase}></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
